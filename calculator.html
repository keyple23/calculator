<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>계산기</title>
<style>
  :root {
    --bg: #f3f3f3;
    --panel: #fafafa;
    --text: #1a1a1a;
    --sub: #606060;
    --num: #ffffff;
    --num-hover: #f6f6f6;
    --fn: #f9f9f9;
    --fn-hover: #f0f0f0;
    --accent: #005fb8;
    --accent-hover: #196ebf;
    --accent-text: #ffffff;
    --border: #e5e5e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #202020;
      --panel: #202020;
      --text: #ffffff;
      --sub: #c5c5c5;
      --num: #3b3b3b;
      --num-hover: #323232;
      --fn: #323232;
      --fn-hover: #3b3b3b;
      --accent: #4cc2ff;
      --accent-hover: #47b1e8;
      --accent-text: #000000;
      --border: #2b2b2b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
  }
  .calc {
    width: min(360px, 100vw - 32px);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
  }
  .title { font-size: 12px; padding: 4px 8px 12px; color: var(--sub); }
  .mode { font-size: 20px; font-weight: 600; padding: 0 8px; }
  .display { padding: 16px 8px 8px; text-align: right; }
  .expr { min-height: 20px; font-size: 14px; color: var(--sub); overflow: hidden; white-space: nowrap; }
  .result {
    font-size: 46px;
    font-weight: 600;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
  }
  .result.small { font-size: 32px; }
  .result.tiny { font-size: 24px; }
  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 2px;
  }
  button {
    height: 52px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font: inherit;
    font-size: 16px;
    color: var(--text);
    background: var(--fn);
    cursor: pointer;
  }
  button:hover { background: var(--fn-hover); }
  button:active { opacity: 0.8; }
  button.num { background: var(--num); font-size: 20px; font-weight: 600; }
  button.num:hover { background: var(--num-hover); }
  button.eq { background: var(--accent); color: var(--accent-text); font-size: 22px; border-color: var(--accent); }
  button.eq:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>
<main class="calc">
  <div class="title">계산기</div>
  <div class="mode">표준</div>
  <div class="display">
    <div class="expr" id="expr"></div>
    <div class="result" id="result">0</div>
  </div>
  <div class="keys" id="keys">
    <button data-k="%">%</button>
    <button data-k="CE">CE</button>
    <button data-k="C">C</button>
    <button data-k="back" aria-label="지우기">⌫</button>

    <button data-k="inv" class="unary">¹⁄ₓ</button>
    <button data-k="sq" class="unary">x²</button>
    <button data-k="sqrt" class="unary">²√x</button>
    <button data-k="/" class="op">÷</button>

    <button data-k="7" class="num">7</button>
    <button data-k="8" class="num">8</button>
    <button data-k="9" class="num">9</button>
    <button data-k="*" class="op">×</button>

    <button data-k="4" class="num">4</button>
    <button data-k="5" class="num">5</button>
    <button data-k="6" class="num">6</button>
    <button data-k="-" class="op">−</button>

    <button data-k="1" class="num">1</button>
    <button data-k="2" class="num">2</button>
    <button data-k="3" class="num">3</button>
    <button data-k="+" class="op">+</button>

    <button data-k="neg" class="num">+/−</button>
    <button data-k="0" class="num">0</button>
    <button data-k="." class="num">.</button>
    <button data-k="=" class="eq">=</button>
  </div>
</main>

<script>
  const SYMBOL = { "+": "+", "-": "−", "*": "×", "/": "÷" };
  const exprEl = document.getElementById("expr");
  const resultEl = document.getElementById("result");

  let entry = "0";          // 현재 입력 중인 숫자 (문자열)
  let stored = null;        // 왼쪽 피연산자
  let op = null;            // 대기 중인 연산자
  let lastOperand = null;   // = 반복용 오른쪽 피연산자
  let fresh = true;         // 다음 숫자 입력 시 entry를 새로 시작
  let expr = "";
  let error = null;
  let justEvaluated = false;

  function clean(n) {
    return Number.parseFloat(n.toPrecision(15));
  }

  function format(value) {
    if (typeof value === "string") {
      const [int, frac] = value.split(".");
      const sign = int.startsWith("-") ? "-" : "";
      const digits = Number(int.replace("-", "")).toLocaleString("en-US");
      return sign + digits + (frac !== undefined ? "." + frac : "");
    }
    if (Math.abs(value) >= 1e16 || (value !== 0 && Math.abs(value) < 1e-10)) {
      return value.toExponential(10).replace(/\.?0+e/, "e");
    }
    return value.toLocaleString("en-US", { maximumFractionDigits: 15 });
  }

  function compute(a, operator, b) {
    switch (operator) {
      case "+": return a + b;
      case "-": return a - b;
      case "*": return a * b;
      case "/":
        if (b === 0) throw new Error(a === 0 ? "결과가 정의되지 않았습니다" : "0으로 나눌 수 없습니다");
        return a / b;
    }
  }

  function setEntry(n) {
    entry = String(clean(n));
  }

  function reset() {
    entry = "0"; stored = null; op = null; lastOperand = null;
    fresh = true; expr = ""; error = null; justEvaluated = false;
  }

  function fail(message) {
    reset();
    error = message;
  }

  function press(k) {
    if (error && !/^[0-9]$|^C$|^CE$|^back$/.test(k)) return;
    if (error) reset();

    // = 직후 새 숫자를 입력하면 새 계산을 시작
    if (justEvaluated && /^[0-9.]$/.test(k)) { stored = null; op = null; lastOperand = null; expr = ""; }
    justEvaluated = k === "=";

    if (/^[0-9]$/.test(k)) {
      if (fresh) { entry = k; fresh = false; if (op === null) expr = ""; }
      else if (entry.replace(/[-.]/g, "").length < 16) entry = entry === "0" ? k : entry + k;
    } else if (k === ".") {
      if (fresh) { entry = "0."; fresh = false; }
      else if (!entry.includes(".")) entry += ".";
    } else if (k === "back") {
      if (!fresh) entry = entry.length > 1 && entry !== "-0" ? entry.slice(0, -1) : "0";
      if (entry === "-") entry = "0";
    } else if (k === "CE") {
      entry = "0"; fresh = true;
    } else if (k === "C") {
      reset();
    } else if (k === "neg") {
      if (entry !== "0") entry = entry.startsWith("-") ? entry.slice(1) : "-" + entry;
    } else if (k in SYMBOL) {
      try {
        if (op !== null && !fresh) setEntry(compute(stored, op, Number(entry)));
      } catch (e) { return fail(e.message); }
      stored = Number(entry);
      op = k;
      lastOperand = null;
      fresh = true;
      expr = `${format(stored)} ${SYMBOL[op]}`;
    } else if (k === "=") {
      if (op === null) { expr = `${format(Number(entry))} =`; fresh = true; return; }
      const b = fresh && lastOperand !== null ? lastOperand : Number(entry);
      try {
        const r = compute(stored, op, b);
        expr = `${format(stored)} ${SYMBOL[op]} ${format(b)} =`;
        setEntry(r);
        stored = clean(r);
        lastOperand = b;
        fresh = true;
      } catch (e) { return fail(e.message); }
    } else if (k === "%") {
      const v = Number(entry);
      setEntry(op === "+" || op === "-" ? (stored ?? 0) * v / 100 : v / 100);
      fresh = true;
    } else if (k === "inv") {
      if (Number(entry) === 0) return fail("0으로 나눌 수 없습니다");
      setEntry(1 / Number(entry)); fresh = true;
    } else if (k === "sq") {
      setEntry(Number(entry) ** 2); fresh = true;
    } else if (k === "sqrt") {
      if (Number(entry) < 0) return fail("잘못된 입력입니다");
      setEntry(Math.sqrt(Number(entry))); fresh = true;
    }
  }

  function render() {
    exprEl.textContent = expr;
    const text = error ?? (fresh ? format(Number(entry)) : format(entry));
    resultEl.textContent = text;
    resultEl.classList.toggle("small", text.length > 11 && text.length <= 15);
    resultEl.classList.toggle("tiny", text.length > 15);
    document.querySelectorAll(".op, .unary, [data-k='%'], [data-k='neg'], [data-k='.']")
      .forEach(b => { b.disabled = Boolean(error); });
  }

  document.getElementById("keys").addEventListener("click", e => {
    const btn = e.target.closest("button");
    if (!btn) return;
    press(btn.dataset.k);
    render();
    btn.blur();
  });

  const KEYMAP = { Enter: "=", "=": "=", Backspace: "back", Escape: "C", Delete: "CE", ",": "." };
  document.addEventListener("keydown", e => {
    let k = KEYMAP[e.key] ?? e.key;
    if (!/^[0-9]$|^[+\-*/.=%]$|^back$|^C$|^CE$/.test(k)) return;
    e.preventDefault();
    press(k);
    render();
  });

  render();
</script>
</body>
</html>
